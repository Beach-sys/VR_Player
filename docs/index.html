<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VR180">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VR180 Local Player</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <canvas id="stage" aria-label="VR180 video viewer"></canvas>

    <section id="emptyState" class="empty-state">
      <div class="mark">180</div>
      <h1>VR180 Local Player</h1>
      <p>Open a local side-by-side VR180 video, then use motion mode in a phone VR headset.</p>
      <label class="primary-button">
        <input id="videoInput" type="file" accept="video/*,.mp4,.mov,.m4v,.webm,.mkv">
        Open Video
      </label>
    </section>

    <section id="controls" class="controls is-hidden" aria-label="Playback controls">
      <div class="top-row">
        <label class="tool-button">
          <input id="videoInputSmall" type="file" accept="video/*,.mp4,.mov,.m4v,.webm,.mkv">
          Open
        </label>
        <div id="fileName" class="file-name"></div>
      </div>

      <div class="bottom-panel">
        <button id="playButton" type="button" class="primary-button">Pause</button>
        <button id="motionButton" type="button" class="tool-button">Enable Motion</button>
        <button id="headsetButton" type="button" class="tool-button is-active">Headset</button>
        <button id="formatButton" type="button" class="tool-button is-active">SBS 3D</button>
        <button id="recenterButton" type="button" class="tool-button">Recenter</button>
        <button id="fullscreenButton" type="button" class="tool-button">Fullscreen</button>
      </div>
    </section>

    <video id="video" playsinline webkit-playsinline crossorigin="anonymous"></video>
  </main>

  <script src="app.js"></script>
</body>
</html>
